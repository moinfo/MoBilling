name: staff
description: "MoBilling staff — dashboard, clients, invoices, payments and tickets on the go."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  mobilling_api:
    path: ../../packages/mobilling_api
  mobilling_auth:
    path: ../../packages/mobilling_auth
  mobilling_ui:
    path: ../../packages/mobilling_ui

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  # Portal shell: PDF share (invoices, receipts) and ticket attachments.
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  # Receipts and fault photos, straight from the camera. file_picker can only
  # browse files, and the whole point of recording an expense on a phone is
  # that the slip is in your hand.
  image_picker: ^1.1.2
  # Biometric unlock of a stored session (Face ID / fingerprint).
  local_auth: ^2.3.0
  # Push notifications (Android first; APNs/iOS deferred).
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
