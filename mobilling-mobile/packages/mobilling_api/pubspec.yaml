name: mobilling_api
description: "HTTP client and typed models for the MoBilling API."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  # Immutable models + JSON: freezed generates the value semantics that make
  # API responses safe to hold in state; json_serializable does the parsing.
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
