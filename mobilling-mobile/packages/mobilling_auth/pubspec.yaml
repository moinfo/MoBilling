name: mobilling_auth
description: "Authentication, session and secure token storage for MoBilling apps."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  mobilling_api:
    path: ../mobilling_api
  # Sanctum tokens are long-lived bearer credentials, so they belong in the
  # Keychain / Android Keystore rather than shared preferences.
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
