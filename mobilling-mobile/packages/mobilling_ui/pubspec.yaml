name: mobilling_ui
description: "Design tokens, theme and shared widgets for MoBilling apps."
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Shipped from the package, not the app, so all three shells draw the mark
  # from one file.
  assets:
    - assets/moinfotech-logo.png

  # The two brand faces from the web design handoff
  # (design_handoff_mobilling/README.md): Archivo for display, IBM Plex Mono
  # for eyebrows and data captions. Both SIL OFL — licences sit beside the
  # files. Body text stays on the platform face on purpose (see `Type`).
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
